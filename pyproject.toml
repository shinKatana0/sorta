[project]
name = "sorta"
version = "0.6.0"
description = "Index and sort a large photo collection by city, person, or event"
readme = "README.md"
license = "MIT"
authors = [{ name = "shinKatana0", email = "shinKatana0@users.noreply.github.com" }]
requires-python = ">=3.11,<3.15"  # upper bound: dictated by the GPU profile — CUDA
# wheels (nvidia-*-cu13) do not support 3.15+; the CPU profile does not need it, but a
# single requires-python for both profiles is simpler, so we do not widen it (F55).
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "blake3>=0.4",
    "imagehash>=4.3",
    "pyexiftool>=0.5",
    "reverse-geocoder>=1.5.1",
    "send2trash>=1.8",
    "insightface>=1.0.1",
    "hdbscan>=0.8.44",
    "numpy>=2.4.6",
    "open-clip-torch>=3.3.0",
    "pillow-heif>=1.4.0",
    "easyocr>=1.7.2",
    # F74/F80: one frame out of a video, so clips get a tile in the web app. Was used
    # without being declared — it happened to be present in the dev venv (pulled in
    # transitively), so the gates were green while a real `uv tool install` produced an
    # environment with no `av` at all and video previews silently did nothing.
    "av>=14.0",
]

[project.optional-dependencies]
# F219: pytest-xdist is what makes the gate use the machine it runs on. The suite is
# 5.7k tests on 24 logical cores in ONE process — 28 minutes, and the gate is run more
# often than anything else in this project. The tests that cannot survive a loaded
# machine carry the `serial` marker below and are run in a second, single-process pass.
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "pytest-cov>=5.0", "pytest-xdist>=3.6",
       "types-PyYAML"]
# F37-B: deep classifier tier (VLM Qwen2.5-VL). Opt-in — not in the base
# dependencies; install `uv sync --extra vlm` when naming.vlm_enabled: true.
# Without it the code lazily falls back to the fast tier (CLIP) — see the graceful
# fallback in junk.py.
vlm = ["transformers>=4.49,<4.52", "accelerate>=0.34", "qwen-vl-utils>=0.0.8"]
# F207: the tray icon of the INSTALLED application. Opt-in for the same reason `vlm` is
# — somebody who installs sorta as a library or runs it from a terminal has no use for
# an indicator, and a windowing dependency in the base list would be paid for by every
# headless install. Pillow is already a base dependency, so this adds exactly one
# package. Without it `sorta-tray` still serves, just with no icon (see sorta/tray.py:
# TrayUnavailable) — which is also what a Linux desktop with no indicator looks like.
tray = ["pystray>=0.19"]
# F55: install profiles for the hardware — exactly one of cpu/gpu (mutually
# exclusive, see tool.uv.conflicts). `uv sync --extra cpu` — the default for other
# machines without NVIDIA; `uv sync --extra gpu` — the current CUDA 13 (Blackwell
# sm_120) stack. The code (faces.py, landmarks.py) already falls back to
# CPUExecutionProvider — no change needed, only the package choice at install time.
cpu = ["onnxruntime>=1.27.0", "torch>=2.10.0", "torchvision>=0.25.0"]
gpu = [
    "onnxruntime-gpu>=1.27.0",
    # CUDA 13 + cuDNN 9 runtime for CUDAExecutionProvider — pip wheels instead of a
    # system CUDA Toolkit. We do not use the onnxruntime-gpu[cuda,cudnn] extras:
    # they reference the outdated nvidia-*-cu13 names, which on PyPI are now just
    # stubs (for CUDA 13 the packages were renamed to the suffixless form).
    "nvidia-cuda-runtime>=13.0",
    "nvidia-cuda-nvrtc>=13.0",
    "nvidia-cublas>=13.0",
    "nvidia-cufft>=12.0",
    "nvidia-curand>=10.0",
    "nvidia-cudnn-cu13>=9.0",
    # torch/torchvision with CUDA (cu130) for CLIP on the GPU — otherwise open-clip
    # pulls CPU torch and junk/landmarks run on the CPU (hours on 300 GB). Index below.
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/shinKatana0/sorta"
Repository = "https://github.com/shinKatana0/sorta"

[project.scripts]
sorta = "sorta.cli:main"
# F211: the first-run wizard of the Windows installer. A `scripts` entry point and not a
# `gui-scripts` one, unlike `sorta-tray` below, because this one is a CONVERSATION: it
# prints what `sorta doctor` found and asks about each tier, so it needs the console the
# tray icon exists to avoid. The installer runs it once at the end of the installation;
# running it again later is how a tier that was refused gets added.
sorta-setup = "sorta.wizard:main"

# F207: the entry point of the tray icon — `gui-scripts` and not `scripts`, because on
# Windows that is the difference between a shortcut that opens a console window behind
# the browser and one that does not. The whole feature is for the person who never sees
# a terminal; a launcher that pops one up would undo it.
[project.gui-scripts]
# `sorta.launcher` and not `sorta.tray`: importing the tray costs 3.59 s of
# `sorta.ui` before its first line runs, and the starting window has to be on the
# screen by then. The launcher imports stdlib and the window, nothing else.
sorta-tray = "sorta.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sorta"]
# F65: the bundled GeoNames data lives INSIDE the package (sorta/data/geo) — the
# repository-root data/ never made it into the wheel, so an installed CLI resolved
# every coordinate to an empty place. `packages` already pulls in the whole sorta/
# tree; `artifacts` states it explicitly so no ignore rule can quietly drop the TSVs.
# F182: the same statement for the frontend. `sorta/web/` is the page, its stylesheet
# and its script; an installed CLI that ships without them cannot render a single
# screen, which is the F65 failure again with a louder symptom.
# F207 added the `.ico`: the tray reads it out of the installed package, so an install
# that ships without it is an application with no icon — the F65/F182 failure once more.
artifacts = ["sorta/data/geo/*.tsv", "sorta/web/*.html", "sorta/web/*.css",
             "sorta/web/app/*.js", "sorta/web/*.ico"]

# F55: cpu/gpu — mutually exclusive install profiles (torch/onnxruntime for
# different hardware). conflicts forces uv to resolve them in separate forks, which
# is what lets tool.uv.sources below pick a different torch index per extra.
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

# F76: insightface depends on plain `onnxruntime`, so under the gpu profile BOTH
# `onnxruntime` and `onnxruntime-gpu` were resolved. They unpack into the same
# site-packages/onnxruntime/ directory, whichever installs last wins, and faces ended
# up on the CPU by coin flip (~40 min vs hours on 24.5k frames).
# `override-dependencies`/`constraint-dependencies` cannot express this: they are
# global, and under the cpu profile the transitive `onnxruntime` is exactly what we
# want. Replacing insightface's declared metadata is per-package instead of
# per-profile, which is what actually fits: under `cpu` onnxruntime stays a DIRECT
# dependency of the extra, so dropping it from insightface changes nothing there (the
# cpu resolution is byte-identical), while under `gpu` only onnxruntime-gpu remains.
# The list below is insightface 1.0.1's own requires-dist minus `onnxruntime`; pinning
# the version keeps it from going stale silently on an upgrade — refresh it when the
# insightface pin moves, and `sorta doctor` shouts if this ever regresses.
[[tool.uv.dependency-metadata]]
name = "insightface"
version = "1.0.1"
requires-dist = [
    "numpy",
    "onnx",
    "opencv-python",
    "tqdm",
    "requests",
    "scipy",
    "scikit-image",
]

# torch/torchvision: under extra=gpu — from the PyTorch cu130 index (CUDA 13, for
# Blackwell sm_120, compatible with the nvidia-*-cu13 packages of onnxruntime-gpu);
# under extra=cpu — from the CPU PyTorch index (resolves cleaner than the default
# PyPI wheel with its hidden dependency on a system CUDA). explicit: the index is
# used only for the packages explicitly pinned below, everything else — from PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[tool.ruff]
line-length = 100
target-version = "py311"

# F182: `sorta/ui/__init__.py` re-exports the tab modules on purpose. Fifty test files
# and `sorta.cli` reach for names that used to be defined in `sorta/ui.py`; the package
# answers to all of them, which is what makes the split a move rather than an edit of
# fifty files. To ruff those imports look dead, and every one of them is load-bearing.
[tool.ruff.lint.per-file-ignores]
"sorta/ui/__init__.py" = ["F401"]

# F219: the gate runs the suite twice — everything not marked `serial` under `-n auto`,
# then the marked ones in a single process. A marker that pytest does not know about is
# only a warning, and a typo in it would silently move a test into the parallel half,
# so it is declared here and `--strict-markers` turns any other marker into an error.
[tool.pytest.ini_options]
markers = [
    """serial: run in the single-process pass — the test asserts about time or binds a \
port, and a loaded machine is exactly the condition under which it fails. Every use \
carries a one-line reason next to it (checked by tests/test_gate_parallel.py).""",
]
addopts = "--strict-markers"

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.report]
# Ratchet: the phase 2-5 stubs are implemented and the suite sits at ~92%, so the
# floor moves 65 -> 85. Kept a few points below the actual number on purpose — a
# threshold that tracks the last run turns every unrelated change into a gate failure.
fail_under = 85
