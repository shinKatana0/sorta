# Sorta — configuration. Copy to config.yaml and edit.

# Source folders with photos (traversed recursively)
sources:
  - "D:/Photos"          # quote Windows paths
  # - "/mnt/photos"

# Path to the SQLite index
database: "sorta.db"

# Language of sorted folders and status text (ru | en | ja), default en (F25/F27).
# Cities/districts are still transliterated — place localization depends on the
# geo hierarchy (F26).
language: en

# CLI log level: DEBUG | INFO | WARNING | ERROR (default WARNING).
# Does not affect folder/name language — only the verbosity of technical messages.
log_level: WARNING

index:
  # F81: folders that must not be SCANNED at all — no stat, no hash, no later
  # stage. Different from sort.exclude_dirs, which indexes the files and only
  # keeps them out of the layout. The file is keyed by source root, so changing
  # the source picks up its own set; the web app writes it, the CLI reads it,
  # and `sorta index --exclude-dir <path>` adds an entry.
  # excludes_file: excludes.yaml   # default: next to the database
  # F72: parallel exiftool sessions. exiftool is a separate process, so it
  # scales almost linearly — measured 11.8 -> 2.0 ms per file going from 1 to 8
  # sessions. 0 = auto min(8, cores). Small batches use fewer sessions.
  # exif_workers: 8
  extensions:
    photo: [jpg, jpeg, png, heic, heif, webp, tif, tiff, bmp]
    raw:   [cr2, cr3, nef, arw, dng, orf, rw2, raf]
    video: [mp4, mov, avi, mts, m2ts, 3gp, mkv]
  # Files smaller than this are ignored (icons, thumbnails, junk)
  min_file_size_kb: 5
  # Threads for parallel hashing/pHash (default min(8, cpu count))
  workers: 8
  # pHash is computed by a separate command `sorta phash` (not in index), then
  # `sorta dupes --near`. Hamming-distance threshold for the report:
  phash_max_distance: 5
  # Skip hidden directories and directories from this list
  skip_dirs: [".thumbnails", "@eaDir", "$RECYCLE.BIN", "System Volume Information"]

dates:
  # Years outside this range are treated as junk in EXIF/filename
  min_year: 1990
  max_year: 2035

dedup:
  # Choosing the canonical file among exact duplicates:
  # prefer_exif_then_largest — the file with an EXIF date first, then the larger one
  canonical_strategy: prefer_exif_then_largest
  # F132: ask the local VLM which frame of a near-duplicate group is the one to keep —
  # ONE comparative question over the whole group ("which of these is best"), which a
  # model answers far more reliably than it scores frames one at a time. It sees what
  # sharpness cannot: closed eyes, a face turned away, a hand across the lens.
  # Needs the VLM extra installed; off by default. A RECOMMENDATION only — it is stored
  # in `group_keeper` and nothing is ever deleted or marked by it. With this off the
  # interface keeps recommending by sharpness, exactly as before — and F145 made
  # `vlm.enabled: false` mean the same thing here: no model, sharpness as before.
  keeper_vlm: false
  # How many frames of one group go into that question (the best N by sharpness). The
  # rest of the group is not shown, and the answer applies to the whole group. Groups of
  # a few dozen frames exist and a 3B model asked to compare 38 pictures answers nothing
  # usable.
  keeper_max_frames: 5
  # The smallest group worth asking the model about. 2 = every group. Set 3 to pay only
  # where the choice is genuinely unclear: on a PAIR of the same scene, sharpness already
  # compares the two frames honestly, and pairs are the overwhelming majority of groups.
  keeper_min_group_size: 3

geo:
  # A gap between frames larger than this (in hours) starts a new time session;
  # within a session, files without GPS inherit the place of GPS neighbours
  # (session_inferred). F85a: a file the session could not reach then inherits the
  # place of its TRIP (trip_inferred) — but only if the trip's GPS frames agree about
  # the city AND the file lies between two of them in time. Trips are cut by the
  # thresholds of the events section below (trip_merge_gap_hours / trip_merge_max_km);
  # there is no separate knob here.
  session_gap_hours: 6
  # Source of the Country/City/District geo hierarchy: offline (bundled GeoNames,
  # default, no network) | online (Nominatim/OSM, opt-in, needs network) — G2/G2b.
  provider: offline
  # Online-provider settings (only when provider: online):
  nominatim_url: "https://nominatim.openstreetmap.org"
  nominatim_user_agent: "sorta-photo-organizer"   # required by the OSM policy
  nominatim_timeout: 10
  # F93: the online provider's answers are cached in the DB (table geo_cache) and
  # survive both a re-run and "Start over" — clear them with `sorta cache --clear-geo`
  # (or `sorta reset --clear-geo` / the checkbox in the reset dialog of `sorta ui`).
  # The key is city+district from the bundled base; the rounding below is only the
  # fallback for coordinates that base cannot place. 3 digits ≈ 110 m.
  cache_coord_digits: 3
  # How long a cached answer stays fresh, in days (borders move rarely, but not
  # never). 0 — never expire.
  cache_max_age_days: 180

events:
  # A gap between frames larger than this (hours) — a new time session
  gap_hours: 6
  # F30: adjacent sessions in the SAME city/region merge into a trip when the gap
  # is smaller than this (hours) — wedding evening+morning or a multi-day trip = one event
  trip_merge_gap_hours: 48
  # F30: groups smaller than this size do not become an event (files go down the
  # "no event" branch → Year/Month)
  min_event_size: 5
  # F44: adjacent sessions merge into a trip even across DIFFERENT cities if they
  # are in the same country and closer than this (km) — Bali across villages → one
  # trip; 0 — merge only on city/region equality
  trip_merge_max_km: 120

sort:
  # Photos with multiple people in --by person mode:
  # primary — into the largest face's folder; shared_folder — into a shared-people folder
  multi_person: primary
  # Directories of the already-manually-sorted part of the collection: files in
  # them (and all subfolders, by path boundary) are not sorted — they stay in the
  # index but drop out of the plan. Combined with the --exclude flag. Photographed
  # documents (receipt/paper/meter, no faces) go to _Documents/ — a separate review
  # folder, not junk.
  exclude_dirs: []
  #   - "D:/Photos/Sorted"
  # Threads for parallel report-thumbnail generation (sort --thumbnails).
  # 0 = auto (min(8, cpu count)); decoding is spread across the pool (F18).
  thumbnail_workers: 0
  # F35: root for albums (sorta album / "Collect into folder" buttons).
  # null → "_Albums" next to the DB
  album_dir: null
  # F56: where to write sort plan reports (CSV/HTML/thumbnails).
  # null → report_output/ next to the DB
  report_dir: null
  # F49: drop the district level in the city layout when the district name is not
  # localized in the config language (foreign transliteration Wichit/Tuban →
  # Country/City/Year; localized Ubud/Kuta and online districts from Nominatim are
  # not affected). false — previous behaviour (transliterated district in the path).
  drop_unlocalized_district: true

faces:
  min_face_px: 40        # faces smaller (px) are not embedded — quality filter
  det_threshold: 0.7     # detector confidence threshold (Immich default)
  min_cluster_size: 5    # min faces per cluster (HDBSCAN); smaller — noise
  max_distance: 0.5      # cosine face-similarity threshold (Immich default)
  # F88: detector input side in px, pinned. Leaving it unset used to let insightface
  # pick the two-pass mode (128x128 then 640x640 on EVERY frame) — the network ran
  # twice per frame and detection cost 165.1 ms/frame instead of 16.5 (x10, 100 real
  # frames, RTX 5090 Laptop). NOT a speed knob: 640 is the model's native size, and
  # lowering it buys almost nothing while losing small faces — 512 measured 13.4
  # ms/frame (3 ms) for 52 faces against 56, i.e. -9% of the people found. Lower it
  # only on hardware that cannot afford 640, and know what it costs.
  det_size: 640
  # Parallel inference sessions (F12.1): faces is inference-bound; independent
  # FaceAnalysis sessions scale ~x3 on GPU. 0 = auto (4 on CUDA, 1 on CPU).
  infer_workers: 0
  # Threads for prefetch frame decoding; default min(8, cores). Since F87 the decode
  # pool feeds BOTH paths — the parallel sessions no longer decode their own frames,
  # so this knob now applies on GPU too. Measured A/B in one session on a 24-core box
  # with an RTX 5090 (500 real frames, 4 sessions): 7.1 img/s coupled -> 10.5
  # decoupled, x1.47. Frames are decoded at full resolution (the ArcFace crop needs
  # it), and the window is ~2x decode_workers decoded plus ~2x infer_workers waiting
  # — raise it only if you have the RAM for that many full-size frames in flight.
  decode_workers: 8

# Phase 5 (F6): places without GPS, event naming, junk classification.
# Event-name provider: template (offline, default) | local_vlm (ollama)
# | claude (Anthropic API, only when explicitly chosen — outbound traffic).
naming:
  # template | vlm | local_vlm | claude — what gives an event its name.
  # F95: `vlm` adds WHAT the event was ("2025-04-24..05-06 Тайланд пляжный отдых") to
  # the dates and the place, which the template already knows exactly, and asks the
  # model for nothing else. It runs the local Qwen2.5-VL of `classify_vlm_model` —
  # the same weights the deep junk tier loads, one copy per run — so it needs the
  # [vlm] extra (uv sync --extra vlm) and a GPU worth the name. Opt-in on purpose:
  # without the extra, or if the model does not load, names fall back to the template.
  # One call per event (3-5 frames at once), so a full collection costs minutes.
  provider: template
  # CLIP zero-shot (landmarks + junk, shared model). Nested under naming.
  clip:
    batch_size: 16       # GPU forward batch; the CLIP path is decode-bound, so this barely matters
    decode_workers: 0    # F64: decode-pool threads. 0 = auto min(cpu, 16) — the real lever for junk/landmarks speed
  landmark_threshold: 0.85   # conservative: 0.35 gave false matches (a wrong city

  # F75: a score alone does not separate a right city from a wrong one — measured on a
  # real collection, wrong cities scored 0.980 against 0.991 for the right one. So a
  # match is corroborated by its neighbours: inside one directory, a city held by less
  # than `dominance` of at least `min` matches drops back to unknown (one card dump is
  # one trip — you cannot be in Prague and Berlin at once). Raise either to fire less.
  # landmark_group_min: 5
  # landmark_group_dominance: 0.6

  # F73: threads running the OCR text detector, each with its own easyocr Reader (one
  # Reader is not thread-safe). OCR was the whole cost of the junk stage — 29 min of a
  # 49 min run — because it ran serially while 20 decode workers idled. Each Reader
  # holds a model in VRAM, so the default is deliberately modest.
  # ocr_workers: 4
  #                            is worse than unknown). Proper fix — a geo model, backlog #11
  junk_threshold: 0.85       # CLIP threshold for screenshot/meme (high:
  #                            photos with camera EXIF/GPS/faces are not marked junk)
  document_threshold: 0.9    # CLIP threshold for "documents" (F15): a photographed
  #                            document (receipt/paper/meter, no faces) → _Documents, not junk
  # "Document rescue" thresholds based on the text-area fraction (F37/F38):
  text_frac_min: 0.08        # a document with a lower text fraction → treated as a scene (FP gate)
  text_frac_document: 0.15   # a photo with a higher text fraction → treated as a document (FN rescue)
  text_rescue_docscore_min: 0.3  # OCR runs only if doc-score ≥ this (perf)
  # F90 measured that gate on the validation collection (2000 frames,
  # `python scripts/measure_ocr_gate.py --probe-below 200`). 0.3 gates 28.4% of the
  # frames and changes 2.1% of the verdicts — 13 OCR calls per verdict, which looks
  # wasteful and is not: raising it to 0.6 saves ~5 min on a full 24k run and gives up
  # ~a third of the rescued documents (39 -> 25 per 2000 frames). Between 0.3 and 0.35
  # the benefit is flat; from 0.4 on it falls off. The probe below the grid also found
  # documents the gate misses TODAY (~1% of clear-scene frames), so the pressure on
  # this number is downward, not upward. Re-measure before touching it.
  text_frac_downscale_px: 1280   # downscale the frame to this before OCR detection (speed)
  # F102: the deep tier's switch, its model and its preparation threads moved to the
  # `vlm:` section just below this one — they describe the shared model runtime, not the
  # naming stage. The old addresses (naming.vlm_enabled, naming.classify_vlm_model,
  # naming.vlm_workers) are STILL READ, so an existing config.yaml keeps working: the new
  # key wins when both are set, and using only an old one logs one warning per run.
  product_candidate_min: 0.4  # product-CLIP above this → the frame goes to the VLM tier (candidate gate)
  # F65: the bundled list now ships inside the package (sorta/data/landmarks.yaml).
  # Leave this out to use it; set a path only to supply your OWN list — a path that
  # does not exist is an error, not a silent fallback.
  # landmarks_file: my-landmarks.yaml
  max_samples: 4             # how many event frames to pass to the VLM/Claude (3–5)
  clip:
    model: ViT-L-14-quickgelu  # the quickgelu variant is required for the openai weights
    pretrained: openai
    batch_size: 16
  local_vlm:                 # ollama, if provider: local_vlm
    base_url: http://localhost:11434
    model: llava
    timeout: 120
  claude:                    # if provider: claude
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    timeout: 60

# F102: the local VLM (Qwen2.5-VL) as a runtime. Two stages use it — the deep junk
# classification tier (memory/document/product) and the `vlm` event-name provider above
# — and both run the SAME weights, one copy per process (the peak is 20.5 GB of VRAM, a
# second instance does not fit). So everything that describes the model itself is here,
# while what belongs to a stage stays with the stage (naming.provider chooses who names
# events, naming.product_candidate_min decides which frame is worth a call at all).
#
# Migrating: the previous keys naming.vlm_enabled / naming.classify_vlm_model /
# naming.vlm_workers are still read, so nothing has to be edited today. A key given in
# both places is taken from `vlm:`; a key given only in the old place logs one warning
# per run.
vlm:
  # The deep tier is opt-in: it needs the [vlm] extra (uv sync --extra vlm), and with
  # the extra missing it falls back gracefully to the fast CLIP tier. The same is
  # switched on for a single run by `--deep` and by the "Deep analysis (VLM)" checkbox
  # in the web app. It is worth switching on when the hardware allows: on a live run it
  # changed 10.7% of the verdicts, mostly into `product`, a class CLIP never produces.
  #
  # F145: IT IS ALSO THE MASTER SWITCH FOR EVERY OTHER QUESTION THE MODEL IS ASKED.
  # `vlm.quality`, `features.pets_verify`, `features.landmarks_verify`,
  # `dedup.keeper_vlm` and `features.junk_rescue` each say WHAT to ask; this one says
  # whether a model may be raised at all. With it false none of them loads a single
  # weight, whatever they are set to, and every one of those stages behaves exactly as
  # it does with its own key off. Nothing here is rewritten when it is switched off —
  # the keys keep their values and start working again the moment it is back on.
  enabled: false
  model: "Qwen/Qwen2.5-VL-3B-Instruct"
  # F101: threads that prepare frames (decode + image preprocessing) for the deep tier
  # while the GPU classifies the previous one — the pass is not heavy but sequential,
  # a frame is prepared and only then answered about. Verdicts do not depend on this
  # number: the labels are applied in the candidate order whatever it is set to, and
  # the frames in flight (~2 per worker) are held in RAM, not in VRAM.
  # Default min(4, cores) — modest on purpose (a two-core machine is a real machine).
  # F164 measured whether it should be more, on the machine that asked the question
  # (24 cores, the card at 51% during the pass): it should not. Preparing one frame
  # already uses about seven cores since the fast image processor arrived (F105), so a
  # second thread takes them from the first — 6, 8 and 12 threads all came out SLOWER
  # than 4 on the live collection, and each of them holds ~170 MB more of prepared
  # frames (scripts/measure_vlm_workers.py). Raise it only against a sweep of your own;
  # the value written here is respected whatever a sweep says.
  # workers: 4
  # F113: the second consumer of these weights — the frame-quality questions no cheap
  # tool answers (are the eyes open, is there a subject at all, is this a pocket shot).
  # Its own toggle, separate from `enabled` above: the deep junk tier and the quality
  # band are different populations, and wanting one says nothing about the other.
  # F145: subordinate to `enabled` above — with the deep tier off this asks nothing.
  # F120: privacy — media classes no VLM is ever shown, by the verdict of the fast tier.
  # `[]` sends everything, which is what happened before this key existed.
  # The default protects `document`: that bucket is passports, medical forms and bank
  # papers, and the project already refuses to DECODE those for display. The model here
  # is local and nothing leaves the machine, so this is a weaker act than showing them —
  # but it is the user's call, and the safe default is the one that asks nothing.
  # THE COST IS REAL: the deep tier is what CORRECTS a wrong `document` verdict (a beach
  # photo scored 0.95 as a document on a live run), so an excluded class keeps whatever
  # the fast tier decided about it. Accepted names: document, product, screenshot, meme.
  # `photo` is not accepted — excluding it would leave the tier with nothing to do.
  # exclude_classes: [document]
  quality: false
  # Which frames the quality VLM may be asked about at all — the uncertainty band
  # (features.sharpness_band_* / features.subject_score_min) narrows it further:
  #   groups — frames of pHash near-duplicate groups (default). That is where the
  #            question is actually asked: five frames of one moment, which is the keeper.
  #   events — every frame that belongs to an event.
  #   faces  — the frames a face was actually FOUND on (F125). This is the population the
  #            eyes question really has: on a live 24 196-file collection that is 7 341
  #            photographs, ~95 minutes of GPU, against 19 757 frames and 4.3 hours for
  #            `all` — and the frames it leaves out are the ones where "are the eyes open"
  #            means nothing anyway. The numbers above are measured on that collection, so
  #            read them as a ratio rather than a promise about yours.
  #            IT NEEDS THE FACES STAGE: without one there are no faces to ask about, and
  #            the quality VLM then does not run at all (it says so in the log; sharpness
  #            and animals are still measured). The trade is deliberate — `has_subject` is
  #            not collected on frames without people, because the model never sees them.
  #   all    — no restriction. READ THE PRICE FIRST: ~0.78 s per frame, so a 20 000-frame
  #            collection is about 4.3 hours of GPU. It is a weekend job, not a default.
  quality_scope: groups
  # F102: the longer side the frame is scaled to before the model sees it — the main
  # lever on what the deep tier costs, since after F101 the remaining time is the GPU
  # half and the GPU half is decided by the number of image tokens. Lowering it is NOT
  # free: documents are the class that depends on small text, and they are exactly what
  # this tier exists to find. Measure before you touch it —
  # `python scripts/measure_vlm_resolution.py` prices 896/672/448 on your own frames and
  # prints how many verdicts moved and in which direction.
  max_edge: 896

# F154: the OBJECT DETECTOR, and its own master switch. A second kind of model, so a
# section of its own next to `vlm:` — and the F145 rule applies to it unchanged: `enabled`
# below says whether a detector may be loaded AT ALL, and `features.detector` says what it
# is wanted for. Neither of them alone raises anything.
#
# Deliberately NOT under `vlm.enabled`: this is not a VLM. It costs 83.8 ms per frame and
# a few hundred megabytes against 0.78 s and 20 GB, so wanting one says nothing about
# wanting the other, and somebody who cleared the deep tier did not thereby ask for boxes.
#
# No new dependency: torchvision is already installed for the CLIP side, only the COCO
# weights are downloaded — once, by torchvision itself, into the torch hub cache
# (TORCH_HOME), which is not the Hugging Face cache the offline switches of §20 govern.
detect:
  enabled: false
  # The torchvision detection model, by the name of its builder function. The mobilenet
  # backbone is the measured one and the reason the cascade is affordable at all; a
  # heavier checkpoint (fasterrcnn_resnet50_fpn) finds a little more and costs several
  # times the 83.8 ms every number in `features.detector*` is counted from.
  model: "fasterrcnn_mobilenet_v3_large_fpn"

# F113: per-frame quality signals (table frame_quality), each taken with the cheapest
# tool that can answer it. Sharpness is a laplacian over the preview every other stage has
# already decoded — milliseconds, so it has no toggle and is always written. Pets are a
# prompt group inside the CLIP call the junk stage already makes, so switching them on
# costs no second pass over the collection — but a new function gets a new toggle, and
# this is it. Everything the two of them cannot decide is a question for the VLM, over the
# uncertain band only (see vlm.quality above).
features:
  pets: false
  # The pet-group CLIP score at or above which cat/dog/pet is written to the frame.
  # PROVISIONAL: CLIP's accuracy on this question has never been measured on a real
  # collection, so this number is a starting point, not a result. Measure before trusting
  # it — `python scripts/measure_frame_quality.py --features pets` prints the score
  # distribution and what each threshold would fire on, over >= 200 of your own frames.
  # F122: measured on 320 hand-labelled frames, stratified by score and weighted back to
  # the collection. 0.70 marks 805 frames at 92% precision / 54% recall; 0.60 marked 895
  # at 89% / 58%. Raising it further buys nothing — 0.85 has the same precision for nine
  # points less recall. Scores are stored, so a different threshold needs no new pass.
  pet_threshold: 0.7
  # F130: check every candidate with the local VLM before the label is written — one
  # question with three answers (a live animal / a picture of one / no animal). Needs
  # `pets` above: it verifies what the CLIP group found, it does not search by itself, and
  # it uses the same weights as everything else (see `vlm:`), not a second model.
  # It exists because the errors CLIP has left at 92% precision are the ones no threshold
  # removes: drawn cats, plush toys, fur coats, a hotdog. CLIP compares a picture to a text
  # as a whole and cannot tell a cat from a picture of a cat; "is this animal alive" is a
  # question about the scene, which is what the VLM answers.
  # With it OFF the stage behaves exactly as before: the label is the threshold above and
  # no frame is shown to a model. F145: `vlm.enabled` off is the same "off" and stands
  # above this key — the model is not raised for it either way.
  pets_verify: false
  # Who is shown to the model when `pets_verify` is on — the SECOND threshold, far below
  # the first. 0.70 is high because nothing was checking CLIP's answer; once something is,
  # the selection can be widened, and that is where the missing recall lives (~466 animals
  # sit below 0.30). Counted on the stored scores of a 19 757-photo collection, at the
  # measured 0.78 s per frame:
  #   0.70  →   805 frames, 10.5 min      0.30 →  1 331 frames, 17.3 min  (the default)
  #   0.50  →   993 frames, 12.9 min      0.20 →  1 679 frames, 21.8 min
  #   everything → 19 757 frames, 4.3 hours
  # F158: 0.30 is MEASURED on 500 random hand-labelled frames (36 animals), by the rule the
  # product itself applies — the model's answer over the score:
  #   threshold 0.70, no cascade  → 18 marked, 94% precision, 47% recall
  #   gate 0.50 + check           → 20 marked, 90% precision, 50% recall  (F130 shipped)
  #   gate 0.30 + check           → 28 marked, 82% precision, 64% recall  (the default)
  # The cascade at 0.50 bought three points of recall for 21 model calls; at 0.30 it buys
  # seventeen for twelve points of precision, and the check removed 6 of 11 false marks
  # without losing a single correct one. Expect the wider gate to cost ~19 minutes against
  # ~12 on a collection of this size — precision is LOWER than the bare threshold, on
  # purpose, and it is the recall you are buying.
  # Ignored when `pets_verify` is off.
  pet_candidate_threshold: 0.3
  # F140: find the screenshots, photographed screens and receipts this stage already
  # classified as photographs. A search by words put memes and screenshots at the top of
  # its results while every row of the embedding table said `photo` — so the frames were
  # not junk leaking into the index, they were ~4% of the "photographs" being misfiled,
  # and they go into the city layout, the duplicates and the albums as ordinary pictures.
  # They are found by a zero-shot query over the vectors `store_embeddings` already keeps:
  #   junk_score = max(looks like screenshot/meme/text/receipt) - max(looks like a photo)
  # which costs no model pass over any image at all — it is a matmul over a stored table.
  # The score is written to `frame_quality.junk_score` for every photograph that has a
  # vector (NULL without one), and frames above the threshold below are shown to the VLM.
  # WITHOUT THE DEEP TIER (`vlm.enabled`) NO VERDICT CHANGES: the score is stored, the
  # candidates are counted, the run is otherwise the one you had.
  junk_rescue: false
  # Who is shown to the model. Reviewed by eye on the live collection (19 753 photographs):
  #   +0.05  →    93 frames (0.5%)  — junk outright
  #   +0.02  →   955 frames (4.8%)  — the band +0.02..+0.05 still holds ~17% real photos
  #    0.00  → 5 688 frames (28.8%) — junk in single figures down here
  # 0.02 is a SELECTION threshold and not a verdict: at ~85% precision, reclassifying by it
  # directly would take ~150 living photographs out of the layout — the mistake measured
  # for animals in F130 — which is why the model gets the last word. 955 frames is ~12
  # minutes at the measured 0.78 s per frame. Read it off your own collection first:
  # `python scripts/measure_junk_rescue.py` prints the distribution and what every
  # threshold would select, before anything is switched on.
  junk_rescue_threshold: 0.02
  # F154: the animal label gets a THIRD tier — an object detector (see `detect:` above,
  # whose `enabled` this needs). It exists for one measured slice out of three; on 200
  # hand-labelled frames, at confidence 0.5:
  #   animals  62% precision / 87% recall   against 71% / 33% for the CLIP label today
  #   people   42% / 96%                    against ~100% precision from faces (F152)
  #   food     20% / 15%                    COCO has no "food": a banana, a pizza, a bun
  # So ANIMALS ONLY. People stay on the face boxes and food stays a query — adding either
  # here is a claim that the measurement changed, and it needs a table of its own first.
  #
  # It is a CASCADE and never a pass: a zero-shot query over the vectors that
  # `store_embeddings` already keeps ranks the collection, and only the top
  # `detector_candidates` frames are shown to the detector — ~3 minutes instead of the ~31
  # a full pass costs at 83.8 ms per frame.
  # The answer overrides the CLIP label in both directions, and every refusal (no vectors,
  # no weights, an error on a frame) falls back to the label you already have — never to
  # "no animal". What was found is stored with its class, confidence and box (table
  # `detections`), which is what makes a "cats" slice apart from a "dogs" one a query
  # rather than another pass.
  detector: false
  # How deep into the query ranking the candidates go — the ONE number that decides what
  # this costs, because the detector sees nothing else. 2 000 frames is ~3 minutes at the
  # measured 83.8 ms. Recall is bounded by the query's own recall at this depth (87% on the
  # labelled sample), so raising it buys the animals the query ranked lower, linearly.
  detector_candidates: 2000
  # The confidence at which a box counts. CHOSEN FROM A TABLE, not in advance: `python
  # scripts/measure_detector.py` prints precision and recall at 0.3 / 0.5 / 0.7 on your own
  # labelled sample, next to what the CLIP label scores on the same frames. 0.5 is the row
  # that was measured (62% / 87%). Every box is stored with its score, so re-choosing this
  # costs a query and no new pass over any image.
  detector_threshold: 0.5
  # F131: the same cascade for places — CLIP proposes a landmark, the local VLM is asked
  # what place the frame shows, and only a proposal the model names itself goes on. The
  # order does not bend: CLIP proposes → the model checks → the corroboration of
  # `naming.landmark_threshold` decides. Agreement between the two models never overrules
  # a country named in the path.
  # It exists because CLIP's failure here is not one of perception but of knowledge: the
  # wrong cities scored 0.980 against 0.991 for the right one, and no threshold splits
  # them. That is also why it was measured before it was built — a 3B model could easily
  # share the same weakness. It does not: on 104 frames with a known answer, 24 of them
  # proposals CLIP believed and corroboration threw away, it confirmed a wrong city ZERO
  # times, at 92% accuracy. Not because it knows every landmark but because it stays
  # silent when it does not — 71 of the 104 answers named nothing at all.
  # With it OFF the stage behaves exactly as before: `naming.landmark_threshold` alone
  # decides, nothing is shown to a model. Needs the [vlm] extra; if the weights will not
  # load, the run falls back to that same behaviour instead of failing. F145: so does
  # `vlm.enabled: false` — the master switch stands above this key, and a base run
  # without the deep tier resolves exactly the places this stage resolved before F131.
  landmarks_verify: false
  # Who is shown to the model when `landmarks_verify` is on — the second, much lower
  # threshold, exactly like the pair above. `naming.landmark_threshold` (0.85) is high
  # because nothing was checking CLIP's proposal; once something is, the selection widens.
  # Measured on the 7 619 place-less frames of a live collection — proposals, and what the
  # corroboration would then do with them:
  #   0.85 →  10 proposals (8 kept, 2 dropped)   ← the CLIP-only gate today
  #   0.70 →  66 proposals (52 kept, 14 dropped)
  #   0.50 → 151 proposals (127 kept, 24 dropped)
  # 151 questions is a couple of minutes of VLM. Never set above
  # `naming.landmark_threshold`: the check is there to widen the band, and a higher value
  # would narrow it instead — a value above it is clamped back down. Ignored when the
  # check is off.
  landmark_candidate_threshold: 0.5
  # The longer side the frame is scaled to before the laplacian. Fixed on purpose: the
  # variance of the laplacian is scale-dependent, so frames measured at different
  # resolutions are not comparable and every threshold below is tied to this number.
  sharpness_max_edge: 512
  # The band where sharpness decides nothing — below it a frame is clearly blurred, above
  # it clearly sharp — and one of the two ways into the VLM population. Also provisional:
  # `python scripts/measure_frame_quality.py --features sharpness` prints the distribution
  # these two should be read off.
  sharpness_band_min: 30.0
  sharpness_band_max: 300.0
  # The other way in: a junk-group CLIP probability of "a photograph" below this means
  # CLIP does not know what it is looking at.
  subject_score_min: 0.9
  # F126: how far down the blur review list opens by default. NOT a verdict — the
  # measurement says the opposite. Reviewed by eye in bands, blurred frames turned up in
  # EVERY band up to 400: sharpness ranks, it does not classify. What the bands did show
  # is where the yield falls off, around 90-120 (< 70: 378 frames, < 90: 530, < 120: 785,
  # < 160: 1215 — on a 19 757-photo collection). So the list opens here and continues on
  # demand, and nothing is ever deleted by this number.
  blur_review_max: 90.0
  # F155: the same laplacian, measured INSIDE the face boxes of a frame (column
  # `frame_quality.face_sharpness`), and the number below which such a frame is a blur
  # candidate. It exists because the whole-frame number answers "how much detail is in this
  # picture", which is a different question from "is it in focus": a detailed sharp street
  # and a smooth blurred face score alike. On a hand-checked sample of 200 frames the
  # whole-frame filter found 2 of the 33 blurred ones — 6%.
  #
  # Measured on the 68 frames of that sample that have a face (13 of them blurred):
  #
  #   over the whole frame, 300 → 10 flagged,  2 right (20% precision, 15% recall)
  #   over the face crop,   100 → 17 flagged,  5 right (29%, 38%)
  #   over the face crop,   200 → 33 flagged,  8 right (24%, 62%)
  #   over the face crop,   400 → 44 flagged, 10 right (23%, 77%)
  #
  # 200 quadruples recall for a comparable number of frames flagged. Provisional: 13
  # blurred frames means one frame is worth ~8 points of recall, so what was measured is
  # the direction, not the figure — `python scripts/measure_frame_quality.py --features
  # sharpness` prints the sweep on your own collection.
  #
  # Two limits worth knowing. It covers only frames a face was found on (a third of a
  # typical archive; landscapes and objects have no such signal at all), and its precision
  # is ~25% at every threshold above — three of four flagged frames are not blurred. It
  # RANKS the blur list; nothing is deleted or reclassified by it.
  face_sharpness_max: 200.0
  # F128: keep the CLIP vector of every canonical photograph (table `clip_embeddings`)
  # instead of throwing it away once its three scores have been read off. Nothing is shown
  # for it — it is what lets a later feature (search by words, an album from a query,
  # "frames like this one") work without a fresh CLIP pass over the whole collection.
  # ON by default: ~60 MB per 20 000 photos, written inside a pass that runs anyway.
  # Turn it off on very large collections — 300 000 photos are ~920 MB. Vectors are stored
  # L2-normalized in float32 together with the model that produced them; change
  # naming.clip.model or naming.clip.pretrained and the stored rows are recomputed rather
  # than used, because vectors of different models are not comparable.
  store_embeddings: true
  # F129: how many frames a search by words takes — `sorta search "торт"` prints this many
  # and `sorta album query "торт"` gathers this many.
  # This is NOT a similarity threshold, and there will not be one, for the same reason
  # sharpness has none: a CLIP score orders frames against each other and means nothing in
  # absolute terms, so "this really is a cake" is not a line anybody can draw. What this
  # number chooses is the size of the SAMPLE a person then looks through — raise it to see
  # further down the ranking, lower it for a shorter list.
  # Two limits of the method worth knowing before choosing it: compound queries ("a cake
  # with candles on a table by the window") are weak, single subjects are what CLIP does
  # well; and the population is personal photographs only (screenshots and documents have
  # no vector at all).
  search_limit: 200
  # F152: the two numbers the FACE SLICES need — "photographs with people", "group
  # photographs", "portraits" in the Slices tab, and `sorta album people|group|portrait`.
  # Nothing here is a confidence threshold: those slices are read off the `faces` table,
  # so a frame is in one because the detector found a box on it, not because a score
  # cleared a line. Both numbers below are GEOMETRY.
  #
  # How many faces make a photograph a group photograph. Three: two people in a frame are
  # a couple or a passer-by, and the slice exists to find the gatherings.
  group_photo_faces: 3
  # A portrait is exactly one face covering at least this share of the frame — the bbox
  # area over width x height. 0.08 is a starting point stated as geometry (a box over 8%
  # of the area is ~28% of each side, i.e. head-and-shoulders rather than a person in a
  # landscape), NOT a measurement on a real collection. The boxes are stored, so
  # re-choosing it costs a query and no new pass over any image. A frame whose dimensions
  # the index never learned is not in this slice: the share cannot be computed for it.
  portrait_face_share: 0.08
  # F141: a SECOND CLIP vector per photograph, computed by a multilingual model and used
  # by search alone (table `search_embeddings`). The price is named here because it is the
  # reason this is off by default: an EXTRA CLIP PASS over the whole collection — 19 753
  # frames in 635 seconds (~10.5 minutes) on the machine it was measured on — and ~40 MB
  # per 20 000 photographs. Nothing else in the pipeline pays for it: the classification
  # model stays `naming.clip.*`, so the landmark, animal and cascade thresholds calibrated
  # on it are untouched.
  # What it buys, on 217 hand-labelled judgements over 8 concepts: Russian queries go from
  # 22% to 98% precision at top-5, and four of the eight (cake, food, mountains, children)
  # go from returning NOTHING to working. English does not regress (95% against 98%).
  # While this is off, `sorta search` and `sorta album query` have nothing to rank and say
  # so — the classification vectors are deliberately NOT used as a fallback, because a
  # ranking quietly produced by the wrong model looks exactly like a good one.
  search_index: false
  # The model of the search side, `<open_clip architecture>/<weights>`. Changing it makes
  # every stored search vector stale (they are recomputed, never mixed), and it does NOT
  # touch classification — that model is `naming.clip.*` and is calibrated on separately.
  search_model: "xlm-roberta-base-ViT-B-32/laion5b_s13b_b90k"
  # F149: the model behind "try to improve" in the Review tab — the button that makes a
  # model-processed COPY of ONE frame you opened and chose. There is no on/off key for it
  # because there is nothing to switch on: nothing is loaded until you press the button,
  # and pressing it is the opt-in. Stated because it is not free: ~400 MB of weights,
  # downloaded from the network once (needs the [vlm] extra for `transformers`), and ~1
  # second per frame on the card this was measured on. Offline with no weights cached, the
  # button says so instead of returning an empty result.
  # `realworld` and not `classical`, which is the whole measurement: `swin2SR-classical`
  # is trained on clean bicubic downscaling — a degradation a real archive does not
  # contain — and lost to a plain unsharp mask; `realworld-sr-x4` beat the mask outright.
  # READ THIS BEFORE USING IT: the model does NOT bring back what was lost, it draws
  # something plausible. That is why the result is always a NEW file marked as processed
  # (`<name>_restored.jpg`, beside the original), why the original is never touched, and
  # why there is no way to run this over more than one frame at a time.
  # WHERE THE COPY GOES: beside the original, with the `_restored` suffix, and never over
  # an existing file (`_1`, `_2`, as everywhere else). Not into a folder of its own,
  # because the copy is an ordinary member of the collection — it is indexed, it goes into
  # the layout and into albums — so a service folder would be a second place to look for a
  # photograph. Its link to the original is stored, and the pair is never shown as a
  # duplicate to sort out.
  restore_model: "caidas/swin2SR-realworld-sr-x4-64-bsrgan-psnr"

# F67: lazy preview cache. Each frame is decoded ONCE (into a 1536px JPEG) and every
# later stage — pHash, CLIP, OCR, VLM, UI thumbnails — reads that instead of decoding
# the original again (HEIC costs ~470 ms per full decode, the preview ~2 ms).
# Budget roughly 150 KB per photo. Safe to delete at any time: `sorta cache --clear`.
# The matching SORTA_PREVIEW_* environment variables override these.
imaging:
  preview_cache: true
  # preview_dir: D:/sorta-previews   # default: %LOCALAPPDATA%\sorta\previews
  preview_max_edge: 1536
  preview_quality: 88
  # F117: a ceiling for the preview cache, in GB. 0 (the default) means no ceiling —
  # what the cache did from F67 until now: it grew until the disk did, and the only
  # cleanup was `sorta cache --clear`, which empties it whole.
  # Measured ~150 KB per photo (12 GB for 38 485 files), so a 300 000-file collection
  # extrapolates to ~45 GB and half a million to ~75 GB. Set a number when that starts
  # to matter; do NOT switch the cache off instead — it pays for itself on every full
  # run (a frame is touched 3-5 times), and a cold cache costs 336 ms per frame against
  # 73 ms warm.
  # Over the ceiling the least recently USED previews are deleted until the total fits
  # — atime, so a preview later stages keep reading survives, and a run never gets its
  # cache wiped just for being a run. Checked every 512 writes, not on each one: the
  # check walks the directory.
  # preview_cache_max_gb: 40
  # F74: a video gets a tile too — one frame, extracted with PyAV into the same
  # cache. 68% of a real collection turned out to be HEVC, which browsers do not
  # play, so a frame is what works everywhere. Only the UI ever asks for these: no
  # pipeline stage decodes video. Env overrides: SORTA_VIDEO_PREVIEWS,
  # SORTA_VIDEO_WORKERS.
  # video_previews: true
  # video_workers: 4
  # F80: the lightbox pages through several frames of a clip instead of the single
  # tile — one frame says what it is, six say whether it is yours and where it was
  # shot. Extracted in one pass and cached like any other preview, only when the
  # lightbox is actually opened. 1 switches the filmstrip off (back to the F74 single
  # frame). Env override: SORTA_VIDEO_FRAMES.
  # video_frames: 6
